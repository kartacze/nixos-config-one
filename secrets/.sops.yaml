# sops creation rules for secrets/ted.yaml (age-encrypted, safe to commit
# once encrypted with `sops secrets/ted.yaml`).
#
# 1. On each NixOS host, derive its age key from the host SSH key:
#      ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub   # -> age1...
#    (sops-nix decrypts with /etc/ssh/ssh_host_ed25519_key by default.)
# 2. Add each host's age1... key below and re-encrypt:
#      sops updatekeys secrets/ted.yaml
# 3. secrets/ted.yaml must define:
#      ted/hashedPassword: <output of `mkpasswd -m yescrypt`>
keys:
  # - &admin age1...  # your admin age key (age-keygen -o ~/.config/sops/age/keys.txt)
  - &g5555-intel age1REPLACE_ME_G5555
  - &latitude-7390 age1REPLACE_ME_LATITUDE
  - &x1-intel age1REPLACE_ME_X1
creation_rules:
  - path_regex: ted\.yaml$
    key_groups:
      - age:
          # - *admin
          - *g5555-intel
          - *latitude-7390
          - *x1-intel
